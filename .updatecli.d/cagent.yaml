---
# UpdateCLI manifest for tracking cagent versions

name: "Update cagent package version"

sources:
  cagentRelease:
    kind: githubrelease
    name: "Get latest cagent release from upstream"
    spec:
      owner: "docker"
      repository: "cagent"
      token: "{{ requiredEnv .github.token }}"
      versionfilter:
        kind: regex
        pattern: '^v([0-9]+[.][0-9]+[.][0-9]+)$'
    transformers:
      - trimprefix: "v"

conditions:
  cagentBinaryExists:
    kind: shell
    name: "Verify cagent binary built for RISC-V64"
    disablesourceinput: true
    spec:
      command: |
        set -euo pipefail
        CAGENT_VERSION="{{ source `cagentRelease` }}"

        # Validate gh is available
        if ! command -v gh >/dev/null 2>&1; then
          echo "Error: gh CLI not found"
          exit 1
        fi

        # Check if we already have this version built
        if gh release view "cagent-v${CAGENT_VERSION}-riscv64" --repo gounthar/docker-for-riscv64 --json assets --jq -e '.assets[] | select(.name=="cagent-linux-riscv64")' >/dev/null 2>&1; then
          echo "Release asset for v${CAGENT_VERSION} already exists. No update needed."
          exit 1
        fi

        # If not built yet, check if upstream release exists
        if ! gh release view "v${CAGENT_VERSION}" --repo docker/cagent >/dev/null 2>&1; then
          echo "Upstream release v${CAGENT_VERSION} not found"
          exit 1
        fi

        echo "Condition met: upstream release exists and not yet built"
        exit 0
      environments:
        - name: PATH
        - name: GITHUB_TOKEN
          from: "{{ requiredEnv .github.token }}"

targets:
  updateDebianChangelog:
    name: "Update cagent version in debian-cagent/changelog"
    kind: file
    sourceid: cagentRelease
    spec:
      file: "debian-cagent/changelog"
      matchpattern: '^cagent [(]([0-9]+[.][0-9]+[.][0-9]+)-1[)]'
      replacepattern: 'cagent ({{ source `cagentRelease` }}-1)'

  updateRPMSpec:
    name: "Update cagent version in rpm-cagent/cagent.spec"
    kind: file
    sourceid: cagentRelease
    spec:
      file: "rpm-cagent/cagent.spec"
      # (?m): Version is not on line 1; without it Go anchors ^ at file start.
      matchpattern: '(?m)^Version:[[:space:]]+([0-9]+[.][0-9]+[.][0-9]+)'
      replacepattern: 'Version:        {{ source `cagentRelease` }}'

  updateCagentSubmodule:
    name: "Update cagent submodule to latest release"
    kind: shell
    # No sourceid: the version is templated into the command below. With
    # sourceid, updatecli also appends it as a trailing argument, which runs
    # as a command of its own ("1.161.0: not found", exit 127), and it
    # rejects sourceid together with disablesourceinput.
    disablesourceinput: true
    spec:
      command: |
        set -euo pipefail
        cd cagent
        git fetch origin --tags
        git checkout "v{{ source `cagentRelease` }}"
        cd ..
        git add cagent
        # Report a change only when the committed submodule pointer (HEAD,
        # not the index just staged) differs from the checked-out tag.
        # Exit 0 = changed, 1 = already there; anything else is a failure.
        CURRENT_COMMIT=$(git ls-tree HEAD cagent | awk '{print $3}')
        TARGET_COMMIT=$(git -C cagent rev-parse HEAD)
        [ "$CURRENT_COMMIT" != "$TARGET_COMMIT" ] || exit 1
      changedif:
        # "shell" is not a valid kind; updatecli accepts exitcode,
        # console/output or file/checksum.
        kind: exitcode
        spec:
          warning: 0
          success: 1
          failure: 2

