name: Track Containerd Releases

on:
  schedule:
    # Check for new releases daily at 11:00 UTC
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log what the tracker would do, change nothing'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  check-release:
    runs-on: ubuntu-latest
    concurrency:
      group: track-containerd-releases
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get latest containerd release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Get latest stable release from containerd/containerd
          LATEST=$(gh api repos/containerd/containerd/releases/latest --jq '.tag_name // empty')

          if [ -z "$LATEST" ]; then
            echo "ERROR: Failed to fetch latest containerd release"
            exit 1
          fi

          echo "latest_release=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest containerd release: $LATEST"

      # Containerd is bundled in Docker Engine builds, not released separately:
      # it counts as built once an engine release lists it in VERSIONS.txt.
      - name: Track release
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run == true }}
          LATEST: ${{ steps.latest.outputs.latest_release }}
          TRACK_COMPONENT: containerd
          TRACK_LATEST: ${{ steps.latest.outputs.latest_release }}
          TRACK_ENGINE_COMPONENT: containerd
          TRACK_LABEL: containerd-release
          TRACK_TITLE_PREFIX: 'Building containerd '
          TRACK_TITLE_SUFFIX: ' for Docker Engine RISC-V64'
          TRACK_BUILD_WORKFLOW: docker-weekly-build.yml
          TRACK_BUILD_INPUT: containerd_ref
          TRACK_ISSUE_BODY: ${{ runner.temp }}/issue-body.md
        run: |
          cat > "$TRACK_ISSUE_BODY" << EOF
          New containerd release detected: **$LATEST**

          **Status:** Docker Engine rebuild automatically triggered with containerd_ref=$LATEST

          Containerd is built as part of the Docker Engine build and bundled in the release.
          The docker-weekly-build workflow has been started automatically.

          **Monitor build progress:**
          \`\`\`bash
          gh run list --workflow=docker-weekly-build.yml --limit 1
          gh run watch
          \`\`\`

          **Upstream release notes:** https://github.com/containerd/containerd/releases/tag/$LATEST

          The daily tracker closes this issue once an engine release lists containerd $LATEST
          in its VERSIONS.txt, and retries the build if none does.
          EOF

          bash .github/scripts/track-release.sh
