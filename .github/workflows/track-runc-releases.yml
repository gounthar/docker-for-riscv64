name: Track Runc Releases

on:
  schedule:
    # Check for new releases daily at 10:00 UTC
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log what the tracker would do, change nothing'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  check-release:
    runs-on: ubuntu-latest
    concurrency:
      group: track-runc-releases
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get latest runc release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Get latest stable release from opencontainers/runc
          LATEST=$(gh api repos/opencontainers/runc/releases/latest --jq '.tag_name // empty')

          if [ -z "$LATEST" ]; then
            echo "ERROR: Failed to fetch latest runc release"
            exit 1
          fi

          echo "latest_release=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest runc release: $LATEST"

      # Runc is bundled in Docker Engine builds, not released separately:
      # it counts as built once an engine release lists it in VERSIONS.txt.
      - name: Track release
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run == true }}
          LATEST: ${{ steps.latest.outputs.latest_release }}
          TRACK_COMPONENT: runc
          TRACK_LATEST: ${{ steps.latest.outputs.latest_release }}
          TRACK_ENGINE_COMPONENT: runc
          TRACK_LABEL: runc-release
          TRACK_TITLE_PREFIX: 'Building runc '
          TRACK_TITLE_SUFFIX: ' for Docker Engine RISC-V64'
          TRACK_BUILD_WORKFLOW: docker-weekly-build.yml
          TRACK_BUILD_INPUT: runc_ref
          TRACK_ISSUE_BODY: ${{ runner.temp }}/issue-body.md
        run: |
          cat > "$TRACK_ISSUE_BODY" << EOF
          New runc release detected: **$LATEST**

          **Status:** Docker Engine rebuild automatically triggered with runc_ref=$LATEST

          Runc is built as part of the Docker Engine build and bundled in the release.
          The docker-weekly-build workflow has been started automatically.

          **Monitor build progress:**
          \`\`\`bash
          gh run list --workflow=docker-weekly-build.yml --limit 1
          gh run watch
          \`\`\`

          **Upstream release notes:** https://github.com/opencontainers/runc/releases/tag/$LATEST

          The daily tracker closes this issue once an engine release lists runc $LATEST
          in its VERSIONS.txt, and retries the build if none does.
          EOF

          bash .github/scripts/track-release.sh
