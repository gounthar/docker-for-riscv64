name: Track Docker CLI Releases

on:
  schedule:
    # Check for new releases daily at 07:00 UTC (1 hour after Moby tracking)
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log what the tracker would do, change nothing'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  check-release:
    runs-on: ubuntu-latest
    concurrency:
      group: track-cli-releases
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get latest Docker CLI release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Get latest stable tag from docker/cli repository
          # Note: docker/cli uses tags but doesn't create GitHub Releases
          LATEST=$(gh api repos/docker/cli/git/refs/tags \
            --jq '.[] | select(.ref | test("refs/tags/v[0-9]+\\.[0-9]+\\.[0-9]+$")) | .ref' \
            | sed 's|refs/tags/||' \
            | sort -V \
            | tail -n1)

          if [ -z "$LATEST" ]; then
            echo "ERROR: Failed to fetch latest Docker CLI release"
            exit 1
          fi

          # Docker CLI tags are like v28.5.1, we create cli-v28.5.1-riscv64
          echo "latest_release=$LATEST" >> "$GITHUB_OUTPUT"
          echo "expected_tag=cli-v${LATEST#v}-riscv64" >> "$GITHUB_OUTPUT"
          echo "Latest Docker CLI tag: $LATEST"

      - name: Track release
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run == true }}
          LATEST: ${{ steps.latest.outputs.latest_release }}
          TRACK_COMPONENT: cli
          TRACK_LATEST: ${{ steps.latest.outputs.latest_release }}
          TRACK_EXPECTED_TAG: ${{ steps.latest.outputs.expected_tag }}
          TRACK_LABEL: cli-release
          TRACK_TITLE_PREFIX: 'Building Docker CLI '
          TRACK_TITLE_SUFFIX: ' for RISC-V64'
          TRACK_BUILD_WORKFLOW: cli-weekly-build.yml
          TRACK_BUILD_INPUT: cli_ref
          TRACK_ISSUE_BODY: ${{ runner.temp }}/issue-body.md
        run: |
          CLEAN_VERSION="${LATEST#v}"
          cat > "$TRACK_ISSUE_BODY" << EOF
          New Docker CLI release detected: **$LATEST**

          **Status:** Build automatically triggered

          The cli-weekly-build workflow has been started automatically.
          Expected completion time: ~5-10 minutes

          **Monitor build progress:**
          \`\`\`bash
          gh run list --workflow=cli-weekly-build.yml --limit 1
          gh run watch
          \`\`\`

          **Expected release:** cli-v${CLEAN_VERSION}-riscv64

          **Upstream release notes:** https://github.com/docker/cli/releases/tag/$LATEST

          This issue will track the build progress. The daily tracker closes it once the
          release is published, and retries the build if it is not.
          EOF

          bash .github/scripts/track-release.sh
