name: Track Moby Releases

on:
  schedule:
    # Check for new releases daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log what the tracker would do, change nothing'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  check-release:
    runs-on: ubuntu-latest
    concurrency:
      group: track-moby-releases
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get latest Moby release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          LATEST=$(gh api repos/moby/moby/releases/latest --jq '.tag_name // empty')

          if [ -z "$LATEST" ]; then
            echo "ERROR: Failed to fetch latest Moby release"
            exit 1
          fi

          # Moby tags are like docker-v29.8.1, we create v29.8.1-riscv64
          echo "latest_release=$LATEST" >> "$GITHUB_OUTPUT"
          echo "expected_tag=${LATEST#docker-}-riscv64" >> "$GITHUB_OUTPUT"
          echo "Latest Moby release: $LATEST"

      - name: Track release
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run == true }}
          LATEST: ${{ steps.latest.outputs.latest_release }}
          TRACK_COMPONENT: moby
          TRACK_LATEST: ${{ steps.latest.outputs.latest_release }}
          TRACK_EXPECTED_TAG: ${{ steps.latest.outputs.expected_tag }}
          TRACK_LABEL: moby-release
          TRACK_TITLE_PREFIX: 'Building Docker '
          TRACK_TITLE_SUFFIX: ' for RISC-V64'
          TRACK_BUILD_WORKFLOW: docker-weekly-build.yml
          TRACK_BUILD_INPUT: moby_ref
          TRACK_ISSUE_BODY: ${{ runner.temp }}/issue-body.md
        run: |
          VERSION_TAG="${LATEST#docker-}"
          cat > "$TRACK_ISSUE_BODY" << EOF
          New Moby release detected: **$LATEST**

          **Status:** Build automatically triggered

          The Build Docker RISC-V64 workflow has been started automatically.
          Expected completion time: ~35-40 minutes

          **Monitor build progress:**
          \`\`\`bash
          gh run list --workflow=docker-weekly-build.yml --limit 1
          gh run watch
          \`\`\`

          **Expected release:** ${VERSION_TAG}-riscv64

          **Upstream release notes:** https://github.com/moby/moby/releases/tag/$LATEST

          This issue will track the build progress. The daily tracker closes it once the
          release is published, and retries the build if it is not.
          EOF

          bash .github/scripts/track-release.sh
