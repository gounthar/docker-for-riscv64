name: Track Docker Compose Releases

on:
  schedule:
    # Check for new releases daily at 09:00 UTC (after Buildx tracking)
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log what the tracker would do, change nothing'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  check-release:
    runs-on: ubuntu-latest
    concurrency:
      group: track-compose-releases
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get latest Docker Compose release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Get latest stable release from docker/compose repository
          LATEST=$(gh api repos/docker/compose/releases/latest --jq '.tag_name // empty')

          if [ -z "$LATEST" ]; then
            echo "ERROR: Failed to fetch latest Docker Compose release"
            exit 1
          fi

          # Docker Compose tags are like v2.40.1, we create compose-v2.40.1-riscv64
          echo "latest_release=$LATEST" >> "$GITHUB_OUTPUT"
          echo "expected_tag=compose-v${LATEST#v}-riscv64" >> "$GITHUB_OUTPUT"
          echo "Latest Docker Compose release: $LATEST"

      - name: Track release
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run == true }}
          LATEST: ${{ steps.latest.outputs.latest_release }}
          TRACK_COMPONENT: compose
          TRACK_LATEST: ${{ steps.latest.outputs.latest_release }}
          TRACK_EXPECTED_TAG: ${{ steps.latest.outputs.expected_tag }}
          TRACK_LABEL: compose-release
          TRACK_TITLE_PREFIX: 'Building Docker Compose '
          TRACK_TITLE_SUFFIX: ' for RISC-V64'
          TRACK_BUILD_WORKFLOW: compose-weekly-build.yml
          TRACK_BUILD_INPUT: compose_ref
          TRACK_ISSUE_BODY: ${{ runner.temp }}/issue-body.md
        run: |
          CLEAN_VERSION="${LATEST#v}"
          cat > "$TRACK_ISSUE_BODY" << EOF
          New Docker Compose release detected: **$LATEST**

          **Status:** Build automatically triggered

          The compose-weekly-build workflow has been started automatically.
          Expected completion time: ~15-20 minutes on self-hosted riscv64 runner

          **Monitor build progress:**
          \`\`\`bash
          gh run list --workflow=compose-weekly-build.yml --limit 1
          gh run watch
          \`\`\`

          **Expected release:** compose-v${CLEAN_VERSION}-riscv64

          **Upstream release notes:** https://github.com/docker/compose/releases/tag/$LATEST

          This issue will track the build progress. The daily tracker closes it once the
          release is published, and retries the build if it is not.
          EOF

          bash .github/scripts/track-release.sh
