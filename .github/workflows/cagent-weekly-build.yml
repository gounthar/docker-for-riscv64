name: Weekly cagent RISC-V64 Build

# Upstream docker/docker-agent (formerly docker/cagent) publishes its own
# docker-agent-linux-riscv64 binary since v1.167.0. This workflow no longer
# compiles cagent: it downloads that binary, checks it against the sha256
# digest GitHub records for the upstream release asset, runs it once on
# riscv64, and republishes it as cagent-linux-riscv64 so the Debian and RPM
# package workflows keep working unchanged.
#
# Triggered by track-cagent-releases.yml with a release tag. There is no
# schedule any more: the weekly dev build from main existed because nobody
# else built riscv64, and upstream now cuts a release every day or two.

on:
  workflow_dispatch:
    inputs:
      cagent_ref:
        description: 'Upstream docker-agent release tag to repackage (e.g. v1.167.0)'
        required: true

permissions:
  contents: write
  actions: write
  issues: write

env:
  UPSTREAM_REPO: docker/docker-agent
  UPSTREAM_ASSET: docker-agent-linux-riscv64

jobs:
  build-cagent:
    # riscv64 runner so the downloaded binary is executed natively once
    # before it is republished.
    runs-on: [self-hosted, riscv64]

    steps:
      - name: Ensure gh is installed
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y gh
          fi

      - name: Validate release tag
        env:
          CAGENT_REF: ${{ github.event.inputs.cagent_ref }}
        run: |
          set -euo pipefail
          if ! [[ "$CAGENT_REF" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::cagent_ref must be an upstream release tag like v1.167.0, got '$CAGENT_REF'"
            exit 1
          fi
          CLEAN_REF="${CAGENT_REF#v}"
          echo "UPSTREAM_TAG=v${CLEAN_REF}" >> "$GITHUB_ENV"
          echo "CLEAN_REF=${CLEAN_REF}" >> "$GITHUB_ENV"

      - name: Download upstream riscv64 binary and verify sha256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/cagent-${CLEAN_REF}"
          rm -rf "$WORK" && mkdir -p "$WORK"
          echo "WORK=$WORK" >> "$GITHUB_ENV"

          # GitHub stores a sha256 digest for every release asset.
          DIGEST=$(gh api "repos/${UPSTREAM_REPO}/releases/tags/${UPSTREAM_TAG}" \
            --jq ".assets[] | select(.name == \"${UPSTREAM_ASSET}\") | .digest")
          if [ -z "$DIGEST" ]; then
            echo "::error::${UPSTREAM_REPO} ${UPSTREAM_TAG} has no ${UPSTREAM_ASSET} asset (upstream ships riscv64 from v1.167.0 on)"
            exit 1
          fi
          EXPECTED="${DIGEST#sha256:}"
          if ! [[ "$EXPECTED" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected digest format for ${UPSTREAM_ASSET}: '$DIGEST'"
            exit 1
          fi

          gh release download "$UPSTREAM_TAG" --repo "$UPSTREAM_REPO" \
            --pattern "$UPSTREAM_ASSET" --dir "$WORK"

          ACTUAL=$(sha256sum "$WORK/$UPSTREAM_ASSET" | awk '{print $1}')
          echo "expected sha256: $EXPECTED"
          echo "actual   sha256: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::sha256 mismatch for ${UPSTREAM_ASSET} ${UPSTREAM_TAG}"
            exit 1
          fi
          echo "UPSTREAM_SHA256=$EXPECTED" >> "$GITHUB_ENV"

      - name: Check and stage binary
        run: |
          set -euo pipefail
          BIN="$WORK/$UPSTREAM_ASSET"
          chmod +x "$BIN"

          file "$BIN"
          if ! file "$BIN" | grep -q 'RISC-V'; then
            echo "::error::${UPSTREAM_ASSET} is not a RISC-V executable"
            exit 1
          fi

          # Run it natively and make sure it reports the tag we asked for.
          VERSION_OUT=$("$BIN" version 2>&1)
          echo "$VERSION_OUT"
          if ! grep -qF "$UPSTREAM_TAG" <<< "$VERSION_OUT"; then
            echo "::error::'version' output does not mention ${UPSTREAM_TAG}"
            exit 1
          fi

          # The package workflows download cagent-linux-riscv64.
          OUT="$WORK/release"
          mkdir -p "$OUT"
          cp "$BIN" "$OUT/cagent-linux-riscv64"
          echo "$VERSION_OUT" > "$OUT/VERSION.txt"
          (cd "$OUT" && sha256sum cagent-linux-riscv64 > cagent-linux-riscv64.sha256)
          ls -lh "$OUT"

      - name: Create release
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_VERSION="cagent-v${CLEAN_REF}-riscv64"
          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"

          cat > "$WORK/release-notes.md" << EOF
          cagent (docker-agent) v${CLEAN_REF} for RISC-V64

          This is the official upstream binary, unmodified:
          https://github.com/${UPSTREAM_REPO}/releases/tag/${UPSTREAM_TAG}
          (asset \`${UPSTREAM_ASSET}\`, sha256 \`${UPSTREAM_SHA256}\`).
          It is republished here under the name \`cagent-linux-riscv64\` for the
          Debian and RPM packages in this repository's APT and RPM repos.

          **Installation:**
          \`\`\`bash
          wget https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_VERSION}/cagent-linux-riscv64
          chmod +x cagent-linux-riscv64
          sudo mv cagent-linux-riscv64 /usr/bin/cagent
          cagent version
          \`\`\`

          Or download \`${UPSTREAM_ASSET}\` straight from the upstream release.
          EOF

          gh release create "${RELEASE_VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "cagent v${CLEAN_REF} for RISC-V64" \
            --notes-file "$WORK/release-notes.md" \
            "$WORK"/release/*

      - name: Trigger package builds for official releases
        if: ${{ !endsWith(steps.create_release.outputs.release_version, '-dev') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_VERSION="${{ steps.create_release.outputs.release_version }}"

          # Wait briefly for release assets to be fully available
          echo "Waiting 10 seconds for release assets to become available..."
          sleep 10

          echo "Triggering Debian package build for ${RELEASE_VERSION}..."
          if ! gh workflow run build-cagent-package.yml --repo "$GITHUB_REPOSITORY" -f release_tag="${RELEASE_VERSION}"; then
            echo "::error::Failed to trigger Debian package build"
            exit 1
          fi

          echo "Triggering RPM package build for ${RELEASE_VERSION}..."
          if ! gh workflow run build-cagent-rpm.yml --repo "$GITHUB_REPOSITORY" -f release_tag="${RELEASE_VERSION}"; then
            echo "::error::Failed to trigger RPM package build"
            exit 1
          fi

          echo "✓ Package builds triggered successfully"

      - name: Close tracking issue
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CAGENT_REF="${{ github.event.inputs.cagent_ref || 'main' }}"

          # Only close issues for official releases (not dev builds)
          if [[ "$CAGENT_REF" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            # Normalize version format to match release creation
            CLEAN_REF="${CAGENT_REF#v}"
            VERSION_TAG="v${CLEAN_REF}"
            RELEASE_VERSION="cagent-${VERSION_TAG}-riscv64"

            echo "Searching for tracking issue for cagent ${VERSION_TAG}..."

            # Find the issue by label and title
            ISSUE_NUMBER=$(gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --label "build-in-progress,cagent-release" \
              --state open \
              --limit 200 \
              --json number,title \
              --jq ".[] | select(.title | contains(\"${VERSION_TAG}\")) | .number" \
              | head -n1)

            if [ -n "$ISSUE_NUMBER" ]; then
              echo "Found tracking issue #${ISSUE_NUMBER}"

              # Comment on the issue with release link
              gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
                --body "Build completed successfully! Release published: https://github.com/${{ github.repository }}/releases/tag/${RELEASE_VERSION}"

              # Close the issue
              gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
                --reason completed \
                --comment "Automatically closing - release published."

              echo "Issue #${ISSUE_NUMBER} closed successfully"
            else
              echo "No tracking issue found for ${VERSION_TAG}"
            fi
          else
            echo "Skipping issue closing for development build"
          fi
