name: Track Docker Buildx Releases

on:
  schedule:
    # Check for new releases daily at 08:00 UTC (after CLI tracking)
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log what the tracker would do, change nothing'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  check-release:
    runs-on: ubuntu-latest
    concurrency:
      group: track-buildx-releases
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get latest Docker Buildx release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Get latest stable release from docker/buildx repository
          LATEST=$(gh api repos/docker/buildx/releases/latest --jq '.tag_name // empty')

          if [ -z "$LATEST" ]; then
            echo "ERROR: Failed to fetch latest Docker Buildx release"
            exit 1
          fi

          # Docker Buildx tags are like v0.29.1, we create buildx-v0.29.1-riscv64
          echo "latest_release=$LATEST" >> "$GITHUB_OUTPUT"
          echo "expected_tag=buildx-v${LATEST#v}-riscv64" >> "$GITHUB_OUTPUT"
          echo "Latest Docker Buildx release: $LATEST"

      - name: Track release
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run == true }}
          LATEST: ${{ steps.latest.outputs.latest_release }}
          TRACK_COMPONENT: buildx
          TRACK_LATEST: ${{ steps.latest.outputs.latest_release }}
          TRACK_EXPECTED_TAG: ${{ steps.latest.outputs.expected_tag }}
          TRACK_LABEL: buildx-release
          TRACK_TITLE_PREFIX: 'Building Docker Buildx '
          TRACK_TITLE_SUFFIX: ' for RISC-V64'
          TRACK_BUILD_WORKFLOW: buildx-weekly-build.yml
          TRACK_BUILD_INPUT: buildx_ref
          TRACK_ISSUE_BODY: ${{ runner.temp }}/issue-body.md
        run: |
          CLEAN_VERSION="${LATEST#v}"
          cat > "$TRACK_ISSUE_BODY" << EOF
          New Docker Buildx release detected: **$LATEST**

          **Status:** Build automatically triggered

          The buildx-weekly-build workflow has been started automatically.
          Expected completion time: ~35-40 minutes on self-hosted riscv64 runner

          **Monitor build progress:**
          \`\`\`bash
          gh run list --workflow=buildx-weekly-build.yml --limit 1
          gh run watch
          \`\`\`

          **Expected release:** buildx-v${CLEAN_VERSION}-riscv64

          **Upstream release notes:** https://github.com/docker/buildx/releases/tag/$LATEST

          **What is Docker Buildx?**
          Docker Buildx is a CLI plugin that extends the docker build command with the full
          BuildKit features, including:
          - Multi-platform builds (--platform flag)
          - Advanced caching strategies
          - Build-time secrets and SSH forwarding
          - Remote builder support

          This issue will track the build progress. The daily tracker closes it once the
          release is published, and retries the build if it is not.
          EOF

          bash .github/scripts/track-release.sh
