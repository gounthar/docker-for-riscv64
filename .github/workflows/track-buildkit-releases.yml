name: Track BuildKit Releases

on:
  schedule:
    # Check for new releases daily at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log what the tracker would do, change nothing'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  check-release:
    runs-on: ubuntu-latest
    concurrency:
      group: track-buildkit-releases
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get latest BuildKit release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Get latest stable release from moby/buildkit repository
          # Filter for vX.Y.Z releases (exclude dockerfile/* and pre-releases)
          LATEST=$(gh release list --repo moby/buildkit --limit 20 \
            --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease | not)
                        | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))]
                  | first | .tagName // empty')

          if [ -z "$LATEST" ]; then
            echo "Could not determine latest BuildKit release"
            exit 1
          fi

          # BuildKit tags are like v0.26.2, we create buildkit-v0.26.2-riscv64
          echo "latest_release=$LATEST" >> "$GITHUB_OUTPUT"
          echo "expected_tag=buildkit-${LATEST}-riscv64" >> "$GITHUB_OUTPUT"
          echo "Latest BuildKit release: $LATEST"

      - name: Track release
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run == true }}
          LATEST: ${{ steps.latest.outputs.latest_release }}
          TRACK_COMPONENT: buildkit
          TRACK_LATEST: ${{ steps.latest.outputs.latest_release }}
          TRACK_EXPECTED_TAG: ${{ steps.latest.outputs.expected_tag }}
          TRACK_LABEL: buildkit-release
          TRACK_TITLE_PREFIX: 'Building BuildKit '
          TRACK_TITLE_SUFFIX: ' for RISC-V64'
          TRACK_BUILD_WORKFLOW: buildkit-weekly-build.yml
          TRACK_BUILD_INPUT: buildkit_ref
          TRACK_ISSUE_BODY: ${{ runner.temp }}/issue-body.md
        run: |
          cat > "$TRACK_ISSUE_BODY" << ISSUE_EOF
          New BuildKit release detected: **$LATEST**

          **Status:** Build automatically triggered

          The buildkit-weekly-build workflow has been started automatically.
          Expected completion time: ~35-40 minutes

          **Monitor build progress:**
          \`\`\`bash
          gh run list --workflow=buildkit-weekly-build.yml --limit 1
          gh run watch
          \`\`\`

          **Expected release:** buildkit-${LATEST}-riscv64

          **Expected artifacts:**
          - \`buildkitd\` - BuildKit daemon
          - \`buildctl\` - BuildKit CLI client
          - Container image: \`ghcr.io/gounthar/buildkit-riscv64:${LATEST}-riscv64\`

          **Upstream release notes:** https://github.com/moby/buildkit/releases/tag/$LATEST

          This issue will track the build progress. The daily tracker closes it once the
          release is published, and retries the build if it is not.
          ISSUE_EOF

          bash .github/scripts/track-release.sh
