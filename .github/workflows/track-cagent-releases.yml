name: Track cagent Releases

on:
  schedule:
    # Check for new releases daily at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log what the tracker would do, change nothing'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  check-release:
    runs-on: ubuntu-latest
    concurrency:
      group: track-cagent-releases
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get latest cagent release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Get latest release from docker/cagent repository
          LATEST=$(gh api repos/docker/cagent/releases/latest --jq '.tag_name // empty')

          if [ -z "$LATEST" ]; then
            echo "Error: Empty release tag received"
            exit 1
          fi

          # cagent tags are like v1.9.13, we create cagent-v1.9.13-riscv64
          echo "latest_release=$LATEST" >> "$GITHUB_OUTPUT"
          echo "expected_tag=cagent-v${LATEST#v}-riscv64" >> "$GITHUB_OUTPUT"
          echo "Latest cagent release: $LATEST"

      - name: Track release
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run == true }}
          LATEST: ${{ steps.latest.outputs.latest_release }}
          TRACK_COMPONENT: cagent
          TRACK_LATEST: ${{ steps.latest.outputs.latest_release }}
          TRACK_EXPECTED_TAG: ${{ steps.latest.outputs.expected_tag }}
          TRACK_LABEL: cagent-release
          TRACK_TITLE_PREFIX: 'Building cagent '
          TRACK_TITLE_SUFFIX: ' for RISC-V64'
          TRACK_BUILD_WORKFLOW: cagent-weekly-build.yml
          TRACK_BUILD_INPUT: cagent_ref
          TRACK_ISSUE_BODY: ${{ runner.temp }}/issue-body.md
        run: |
          CLEAN_VERSION="${LATEST#v}"
          cat > "$TRACK_ISSUE_BODY" << EOF
          New cagent release detected: **$LATEST**

          **Status:** Build automatically triggered

          The cagent-weekly-build workflow has been started automatically.
          Expected completion time: ~5-10 minutes

          **About cagent:**
          Multi-agent AI runtime by Docker Engineering

          **Monitor build progress:**
          \`\`\`bash
          gh run list --workflow=cagent-weekly-build.yml --limit 1
          gh run watch
          \`\`\`

          **Expected release:** cagent-v${CLEAN_VERSION}-riscv64

          **Upstream release notes:** https://github.com/docker/cagent/releases/tag/$LATEST

          This issue will track the build progress. The daily tracker closes it once the
          release is published, and retries the build if it is not.
          EOF

          bash .github/scripts/track-release.sh
